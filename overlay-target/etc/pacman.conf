# ChoutesOS pacman configuration
[options]
HoldPkg           = pacman glibc
Architecture      = auto
Color
CheckSpace
ParallelDownloads = 5
DownloadUser      = alpm
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# ChoutesOS packages: the XanMod kernel, Helium, themes and updates.
# Served from https://packages.choutes.com (hosted on GitHub).
[choutesos]
SigLevel = Required DatabaseRequired
Server = https://packages.choutes.com/$repo/$arch
